name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: rm -rf src/app/api src/app/robots.ts src/app/sitemap.ts

      - name: Export config
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            basePath: "/skill-website",
            assetPrefix: "/skill-website",
            trailingSlash: true,
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
          };
          export default nextConfig;
          EOF

      - run: npm run build

      # The app hard-codes absolute paths ("/assets/...", "/scripts/...") in
      # runtime-injected HTML, which 404 under the /skill-website/ sub-path.
      # Rewrite them in the exported output so the preview shows real content.
      - name: Rewrite absolute asset paths
        run: |
          find out -type f \( -name '*.html' -o -name '*.js' -o -name '*.txt' -o -name '*.json' \) -print0 |
            xargs -0 sed -i \
              -e 's#"/assets/#"/skill-website/assets/#g' \
              -e "s#'/assets/#'/skill-website/assets/#g" \
              -e 's#(/assets/#(/skill-website/assets/#g' \
              -e 's#"/scripts/#"/skill-website/scripts/#g' \
              -e "s#'/scripts/#'/skill-website/scripts/#g"

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
